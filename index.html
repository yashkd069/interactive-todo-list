<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <header>
      <p class="tag">TASK MANAGER</p>
      <h1>My To-Do List</h1>
      <p>Stay organized and get things done.</p>
    </header>
    <section class="card">
      <div class="input-row">
        <input id="taskInput" type="text" placeholder="Enter a new task..." autocomplete="off">
        <button id="addBtn">Add Task</button>
      </div>
      <div class="stats">
        <span id="taskCount">0 tasks</span>
        <button id="clearCompleted" class="clear">Clear completed</button>
      </div>
      <ul id="taskList"></ul>
      <p id="emptyMessage" class="empty">No tasks yet. Add your first task!</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
